let EEd=null;

let DV=null;

/* ── ESTADO DEL MODAL DE BÚSQUEDA ── */
let SRCH={open:false,tipo:"",linea:-1,q:"",formCtx:""};

async function fsSet(col,id,data){await db.collection(col).doc(id).set(data);}
async function fsDel(col,id){await db.collection(col).doc(id).delete();}
async function fsGetAll(col){const snap=await db.collection(col).get();return snap.docs.map(d=>({id:d.id,...d.data()}));}
async function logAct(accion,detalle=""){
try{await db.collection("logs").add({usuario:CU?.email||"?",accion,detalle,fecha:tod(),hora:new Date().toLocaleTimeString("es-EC"),ts:firebase.firestore.FieldValue.serverTimestamp()});}

}
async function cargarLogs(){

/* ════════════════════════════════════════
   MODAL DE BÚSQUEDA — Lógica central
   ════════════════════════════════════════ */

/**
 * Abre el modal de búsqueda.
 * @param {string} tipo  - "cliente" | "proveedor" | "producto"
 * @param {string} ctx   - "venta" | "compra"
 * @param {number} linea - índice de línea para productos, -1 si es entidad
 */
function openSrch(tipo, ctx, linea){
  SRCH={open:true, tipo, linea, q:"", formCtx:ctx};
  renderSrch();
}

function closeSrch(){
  SRCH.open=false;
  SRCH.q="";
  // Solo re-renderizamos el modal (lo removemos), sin full R()
  const el=document.getElementById("srch-overlay");
  if(el) el.remove();
}

function renderSrch(){
  // Remover overlay previo si existe
  const prev=document.getElementById("srch-overlay");
  if(prev) prev.remove();
  if(!SRCH.open) return;

  const overlay=document.createElement("div");
  overlay.id="srch-overlay";
  overlay.className="srch-overlay";
  overlay.onclick=e=>{if(e.target===overlay) closeSrch();};

  const titles={cliente:"🔍 Buscar Cliente", proveedor:"🔍 Buscar Proveedor", producto:"🔍 Buscar Producto"};

  overlay.innerHTML=`
<div class="srch-panel">
  <div class="srch-header">
    <span class="srch-title">${titles[SRCH.tipo]}</span>
    <input id="srch-input" type="text" placeholder="Nombre, RUC, SKU..." autocomplete="off"
      oninput="SRCH.q=this.value;updateSrchList()" autofocus>
    <button class="srch-close" onclick="closeSrch()">✕</button>
  </div>
  <div class="srch-list" id="srch-list"></div>
</div>`;

  document.body.appendChild(overlay);
  updateSrchList();

  // Focus automático
  setTimeout(()=>{
    const inp=document.getElementById("srch-input");
    if(inp) inp.focus();
  }, 50);
}

function updateSrchList(){
  const el=document.getElementById("srch-list");
  if(!el) return;
  const q=SRCH.q.toLowerCase().trim();

  let items=[];

  if(SRCH.tipo==="cliente"){
    items=DB.clientes.filter(c=>
      !q||c.nombre?.toLowerCase().includes(q)||
      c.ruc?.toLowerCase().includes(q)||
      c.telefono?.toLowerCase().includes(q)||
      c.email?.toLowerCase().includes(q)
    );
    if(!items.length){
      el.innerHTML=`<div class="srch-empty">Sin resultados para "${h(SRCH.q)}"</div>`;
      return;
    }
    el.innerHTML=items.map((c,i)=>{
      const idx=DB.clientes.indexOf(c);
      return`<div class="srch-item" onclick="selSrchCliente(${idx})">
        <div>
          <div class="srch-item-main">${h(c.nombre)}</div>
          <div class="srch-item-sub">${c.ruc?`RUC: ${h(c.ruc)} · `:""}${c.telefono||""} ${c.email?`· ${h(c.email)}`:""}${c.credito?` · Crédito: ${c.credito} días`:""}</div>
        </div>
        ${c.credito>0?`<span class="srch-item-badge">${bdg(`${c.credito}d`,C.blue)}</span>`:""}
      </div>`;
    }).join("");
  }
  else if(SRCH.tipo==="proveedor"){
    items=DB.proveedores.filter(p=>
      !q||p.nombre?.toLowerCase().includes(q)||
      p.ruc?.toLowerCase().includes(q)||
      p.telefono?.toLowerCase().includes(q)||
      p.email?.toLowerCase().includes(q)
    );
    if(!items.length){
      el.innerHTML=`<div class="srch-empty">Sin resultados para "${h(SRCH.q)}"</div>`;
      return;
    }
    el.innerHTML=items.map((p)=>{
      const idx=DB.proveedores.indexOf(p);
      return`<div class="srch-item" onclick="selSrchProveedor(${idx})">
        <div>
          <div class="srch-item-main">${h(p.nombre)}</div>
          <div class="srch-item-sub">${p.ruc?`RUC: ${h(p.ruc)} · `:""}${p.telefono||""} ${p.contacto?`· Contacto: ${h(p.contacto)}`:""}</div>
        </div>
      </div>`;
    }).join("");
  }
  else if(SRCH.tipo==="producto"){
    items=DB.productos.filter(p=>
      p.stock>0&&(!q||p.nombre?.toLowerCase().includes(q)||
      p.sku?.toLowerCase().includes(q)||
      p.categoria?.toLowerCase().includes(q))
    );
    if(!items.length){
      el.innerHTML=`<div class="srch-empty">Sin resultados para "${h(SRCH.q)}"</div>`;
      return;
    }
    const esVenta=SRCH.formCtx==="venta";
    el.innerHTML=items.map((p)=>{
      const idx=DB.productos.indexOf(p);
      const precio=esVenta?p.precio:p.costo;
      const lblP=esVenta?"Precio":"Costo";
      return`<div class="srch-item" onclick="selSrchProducto(${idx})">
        ${p.imagen?`<img src="${p.imagen}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;flex-shrink:0">`:`<div style="width:36px;height:36px;border-radius:6px;border:1px solid #334155;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">📦</div>`}
        <div style="flex:1;min-width:0">
          <div class="srch-item-main">${h(p.nombre)}</div>
          <div class="srch-item-sub">${p.sku?`SKU: ${h(p.sku)} · `:""}${h(p.categoria||"")} ${p.unidad?`· ${h(p.unidad)}`:""}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">

function checkAlarmas(){
const hoy=new Date();hoy.setHours(0,0,0,0);const alertas=[];
DB.clientes.forEach(cli=>{
(cli.fechas||[]).forEach(f=>{
if(!f.fecha||!f.tipo)return;
const parts=f.fecha.split("-");let mes,dia;
if(parts.length===2){mes=parseInt(parts[0]);dia=parseInt(parts[1]);}
else if(parts.length===3){mes=parseInt(parts[1]);dia=parseInt(parts[2]);}
else return;
if(isNaN(mes)||isNaN(dia))return;
const anio=hoy.getFullYear();
let fo=new Date(anio,mes-1,dia);fo.setHours(0,0,0,0);
if(fo<hoy)fo=new Date(anio+1,mes-1,dia);
const diff=Math.round((fo-hoy)/86400000);
if(diff>=0&&diff<=7)alertas.push({cliente:cli.nombre,tipo:f.tipo,fecha:f.fecha,dias:diff});
});
});
return alertas;
}

if(w>hh){if(w>MAX){hh=Math.round(hh*(MAX/w));w=MAX;}}else{if(hh>MAX){w=Math.round(w*(MAX/hh));hh=MAX;}}

async function vGuardar(){
if(!VF.cliente)return alert("Seleccione un cliente.");
const lns=VF.lns.filter(l=>l.desc&&l.desc.trim()!=="");
if(!lns.length)return alert("Agregue al menos un producto.");
const total=lns.reduce((a,l)=>a+l.qty*l.pu,0);
const cli=VF.cliente==="cf"?"Consumidor Final":(DB.clientes[+VF.cliente]?.nombre||VF.cliente);
const id=uid();
const v={id,fecha:VF.fecha,cliente:cli,fp:VF.fp,vence:VF.vence,lineas:lns,subtotal:total,iva:0,total,saldo:VF.fp==="contado"?0:total,estado:VF.fp==="contado"?"pagado":"pendiente",pagos:[],usuario:CU?.email||""};
try{
await fsSet("ventas",id,v);DB.ventas.push(v);
for(const l of lns){if(l.pid!==""){const idx=+l.pid;if(DB.productos[idx]){DB.productos[idx].stock-=l.qty;await fsSet("productos",DB.productos[idx].id,DB.productos[idx]);}}}
await logAct("NUEVA VENTA",`${cli} · ${fmt(total)}`);VV="lista";VF={fecha:tod(),cliente:"",clienteIdx:-1,fp:"contado",vence:"",lns:[{id:uid(),pid:"",desc:"",qty:1,pu:0}]};R();
}catch(e){alert("Error: "+e.message);}
}
async function vActualizar(){
if(!VF.cliente)return alert("Seleccione un cliente.");
const lns=VF.lns.filter(l=>l.desc&&l.desc.trim()!=="");
if(!lns.length)return alert("Agregue al menos un producto.");
const idx=VEd;const old=DB.ventas[idx];
if(!old||!puedeModificar(old))return alert("No se puede editar esta factura.");
const total=lns.reduce((a,l)=>a+l.qty*l.pu,0);
const cli=VF.cliente==="cf"?"Consumidor Final":(DB.clientes[+VF.cliente]?.nombre||VF.cliente);
try{
for(const l of (old.lineas||[])){if(l.pid!==""){const pidx=+l.pid;if(DB.productos[pidx]){DB.productos[pidx].stock+=l.qty;await fsSet("productos",DB.productos[pidx].id,DB.productos[pidx]);}}}
for(const l of lns){if(l.pid!==""){const pidx=+l.pid;if(DB.productos[pidx]){DB.productos[pidx].stock-=l.qty;await fsSet("productos",DB.productos[pidx].id,DB.productos[pidx]);}}}
const updated={...old,fecha:VF.fecha,cliente:cli,fp:VF.fp,vence:VF.vence,lineas:lns,subtotal:total,iva:0,total,saldo:VF.fp==="contado"?0:total,estado:VF.fp==="contado"?"pagado":"pendiente"};
await fsSet("ventas",old.id,updated);DB.ventas[idx]=updated;
await logAct("EDITAR VENTA",`${cli} · ${fmt(total)}`);VV="lista";VEd=null;R();
}catch(e){alert("Error: "+e.message);}

async function vAnular(i){
const v=DB.ventas[i];

}catch(e){alert("Error: "+e.message);}

async function cGuardar(){
if(!CF.proveedor)return alert("Seleccione un proveedor.");
const lns=CF.lns.filter(l=>l.desc&&l.desc.trim()!=="");
if(!lns.length)return alert("Agregue al menos un producto.");
const total=lns.reduce((a,l)=>a+l.qty*l.costo,0);
const prov=DB.proveedores[+CF.proveedor]?.nombre||CF.proveedor;
const id=uid();
const c={id,fecha:CF.fecha,proveedor:prov,fp:CF.fp,vence:CF.vence,lineas:lns,subtotal:total,iva:0,total,saldo:CF.fp==="contado"?0:total,estado:CF.fp==="contado"?"pagado":"pendiente",pagos:[],usuario:CU?.email||""};
try{
await fsSet("compras",id,c);DB.compras.push(c);
for(const l of lns){if(l.pid!==""){const idx=+l.pid;if(DB.productos[idx]){DB.productos[idx].stock+=l.qty;await fsSet("productos",DB.productos[idx].id,DB.productos[idx]);}}}
await logAct("NUEVA COMPRA",`${prov} · ${fmt(total)}`);CV="lista";CF={fecha:tod(),proveedor:"",proveedorIdx:-1,fp:"contado",vence:"",lns:[{id:uid(),pid:"",desc:"",qty:1,costo:0}]};R();
}catch(e){alert("Error: "+e.message);}
}
async function cActualizar(){
if(!CF.proveedor)return alert("Seleccione un proveedor.");
const lns=CF.lns.filter(l=>l.desc&&l.desc.trim()!=="");
if(!lns.length)return alert("Agregue al menos un producto.");
const idx=CEd;const old=DB.compras[idx];
if(!old||!puedeModificar(old))return alert("No se puede editar esta compra.");
const total=lns.reduce((a,l)=>a+l.qty*l.costo,0);
const prov=DB.proveedores[+CF.proveedor]?.nombre||CF.proveedor;
try{
for(const l of (old.lineas||[])){if(l.pid!==""){const pidx=+l.pid;if(DB.productos[pidx]){DB.productos[pidx].stock-=l.qty;await fsSet("productos",DB.productos[pidx].id,DB.productos[pidx]);}}}
for(const l of lns){if(l.pid!==""){const pidx=+l.pid;if(DB.productos[pidx]){DB.productos[pidx].stock+=l.qty;await fsSet("productos",DB.productos[pidx].id,DB.productos[pidx]);}}}
const updated={...old,fecha:CF.fecha,proveedor:prov,fp:CF.fp,vence:CF.vence,lineas:lns,subtotal:total,iva:0,total,saldo:CF.fp==="contado"?0:total,estado:CF.fp==="contado"?"pagado":"pendiente"};
await fsSet("compras",old.id,updated);DB.compras[idx]=updated;
await logAct("EDITAR COMPRA",`${prov} · ${fmt(total)}`);CV="lista";CEd=null;R();
}catch(e){alert("Error: "+e.message);}
}
async function cAnular(i){
const c=DB.compras[i];
if(!puedeModificar(c))return alert("No se puede anular: esta compra ya está pagada, anulada o tiene devoluciones.");
if(!confirm("¿Anular esta compra? Se revertirá el stock de los productos involucrados."))return;
try{
for(const l of (c.lineas||[])){if(l.pid!==""){const idx=+l.pid;if(DB.productos[idx]){DB.productos[idx].stock-=l.qty;await fsSet("productos",DB.productos[idx].id,DB.productos[idx]);}}}
const updated={...c,estado:"anulado",saldo:0};
await fsSet("compras",c.id,updated);DB.compras[i]=updated;
await logAct("ANULAR COMPRA",`${c.proveedor} · ${fmt(c.total)}`);R();
}catch(e){alert("Error: "+e.message);}
}

${bx("🖨 Imprimir / PDF",C.acc,"printReporte()","margin-left:auto")}

const V=DB.ventas.filter(v=>v.fecha>=ST.rD&&v.fecha<=ST.rH&&v.estado!=="anulado"&&!v.esSaldoInicial).concat(devPseudo("venta").filter(d=>d.fecha>=ST.rD&&d.fecha<=ST.rH));
const K=DB.compras.filter(c=>c.fecha>=ST.rD&&c.fecha<=ST.rH&&c.estado!=="anulado"&&!c.esSaldoInicial).concat(devPseudo("compra").filter(d=>d.fecha>=ST.rD&&d.fecha<=ST.rH));

function rDV(V){const pf={};V.forEach(v=>{if(!pf[v.fecha])pf[v.fecha]={vs:[],t:0};pf[v.fecha].vs.push(v);pf[v.fecha].t+=v.total;});const f=Object.keys(pf).sort().reverse();return`<div class="h2">📋 Diario de Ventas</div><div class="grid2" style="margin-bottom:14px">${sc("Facturas",V.filter(v=>!v.esDevolucion).length,C.acc)}${sc("Total",fmt(V.reduce((a,v)=>a+v.total,0)),C.green)}</div>${f.map(d=>`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b style="color:${C.acc2}">${d}</b><b style="color:${C.green}">${fmt(pf[d].t)}</b></div><div class="ov"><table><thead><tr><th>#</th><th>Cliente</th><th>Forma</th><th>Total</th><th>Estado</th><th>Usuario</th></tr></thead><tbody>${pf[d].vs.map(v=>`<tr><td style="font-size:11px;color:${C.muted}">#${v.id.slice(-6).toUpperCase()}</td><td>${h(v.cliente)}</td><td>${v.fp}</td><td style="color:${C.green};font-weight:600">${fmt(v.total)}</td><td>${bdg(v.estado,estColor(v.estado))}</td><td style="font-size:11px;color:${C.muted}">${v.usuario||"-"}</td></tr>`).join("")}</tbody></table></div></div>`).join("")||`<div class="card empty">Sin ventas en el rango</div>`}`;}
function rVC(V){const m={};V.forEach(v=>{if(!m[v.cliente])m[v.cliente]={n:0,t:0};if(!v.esDevolucion)m[v.cliente].n++;m[v.cliente].t+=v.total;});const lista=Object.entries(m).sort((a,b)=>b[1].t-a[1].t);const gt=V.reduce((a,v)=>a+v.total,0);const rows=lista.map(([c,d])=>{const p=gt>0?((d.t/gt)*100).toFixed(1):0;return`<tr><td><b>${h(c)}</b></td><td>${d.n}</td><td style="color:${C.green};font-weight:700">${fmt(d.t)}</td><td><div style="display:flex;align-items:center;gap:6px"><div style="background:#334155;border-radius:4px;height:6px;width:80px"><div style="width:${p}%;background:${C.green};height:6px;border-radius:4px"></div></div><span style="font-size:11px">${p}%</span></div></td></tr>`;}).join("");return`<div class="h2">👥 Ventas por Cliente</div><div class="card"><div class="ov"><table><thead><tr><th>Cliente</th><th>Fact.</th><th>Total</th><th>%</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="empty">Sin datos</td></tr>`}${lista.length?`<tr style="background:${C.bg}"><td style="font-weight:700">TOTAL</td><td>${V.length}</td><td style="color:${C.green};font-weight:700">${fmt(gt)}</td><td>100%</td></tr>`:""}</tbody></table></div></div>`;}
function rVP(V){const m={};V.forEach(v=>(v.lineas||[]).forEach(l=>{const k=l.desc;const prod=DB.productos.find(p=>p.nombre===k);if(!m[k])m[k]={q:0,t:0,f:0,sku:prod?.sku||"-"};m[k].q+=l.qty;m[k].t+=l.qty*l.pu;if(l.qty>0)m[k].f++;}));const lista=Object.entries(m).sort((a,b)=>b[1].t-a[1].t);const gt=lista.reduce((a,[,d])=>a+d.t,0);const rows=lista.map(([p,d])=>{const pc=gt>0?((d.t/gt)*100).toFixed(1):0;return`<tr><td style="color:${C.muted};font-size:12px">${h(d.sku)}</td><td><b>${h(p)}</b></td><td>${d.q}</td><td>${d.f}</td><td style="color:${C.green};font-weight:700">${fmt(d.t)}</td><td><div style="display:flex;align-items:center;gap:6px"><div style="background:#334155;border-radius:4px;height:6px;width:80px"><div style="width:${pc}%;background:${C.acc};height:6px;border-radius:4px"></div></div><span style="font-size:11px">${pc}%</span></div></td></tr>`;}).join("");return`<div class="h2">📦 Ventas por Producto</div><div class="card"><div class="ov"><table><thead><tr><th>SKU</th><th>Producto</th><th>Uds.</th><th>Veces</th><th>Total</th><th>%</th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="empty">Sin datos</td></tr>`}</tbody></table></div></div>`;}
function rRPC(V){const m={};V.forEach(v=>(v.lineas||[]).forEach(l=>{const k=l.desc+"|||"+v.cliente;const prod=DB.productos.find(p=>p.nombre===l.desc);if(!m[k])m[k]={p:l.desc,c:v.cliente,q:0,t:0,n:0,sku:prod?.sku||"-"};m[k].q+=l.qty;m[k].t+=l.qty*l.pu;if(l.qty>0)m[k].n++;}));const rows=Object.values(m).sort((a,b)=>b.t-a.t).map(r=>`<tr><td style="color:${C.muted};font-size:12px">${h(r.sku)}</td><td><b>${h(r.p)}</b></td><td>${h(r.c)}</td><td>${r.q}</td><td>${r.n}</td><td style="color:${C.green};font-weight:600">${fmt(r.t)}</td></tr>`).join("");return`<div class="h2">🔗 Relación Producto - Cliente</div><div class="card"><div class="ov"><table><thead><tr><th>SKU</th><th>Producto</th><th>Cliente</th><th>Uds.</th><th>Veces</th><th>Total</th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="empty">Sin datos</td></tr>`}</tbody></table></div></div>`;}
function rDC(K){const pf={};K.forEach(c=>{if(!pf[c.fecha])pf[c.fecha]={cs:[],t:0};pf[c.fecha].cs.push(c);pf[c.fecha].t+=c.total;});const f=Object.keys(pf).sort().reverse();return`<div class="h2">📋 Diario de Compras</div><div class="grid2" style="margin-bottom:14px">${sc("Órdenes",K.filter(c=>!c.esDevolucion).length,C.acc)}${sc("Total",fmt(K.reduce((a,c)=>a+c.total,0)),C.acc)}</div>${f.map(d=>`<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b style="color:${C.acc2}">${d}</b><b style="color:${C.acc}">${fmt(pf[d].t)}</b></div><div class="ov"><table><thead><tr><th>#</th><th>Proveedor</th><th>Forma</th><th>Total</th><th>Estado</th><th>Usuario</th></tr></thead><tbody>${pf[d].cs.map(c=>`<tr><td style="font-size:11px;color:${C.muted}">#${c.id.slice(-6).toUpperCase()}</td><td>${h(c.proveedor)}</td><td>${c.fp}</td><td style="color:${C.acc};font-weight:600">${fmt(c.total)}</td><td>${bdg(c.estado,estColor(c.estado))}</td><td style="font-size:11px;color:${C.muted}">${c.usuario||"-"}</td></tr>`).join("")}</tbody></table></div></div>`).join("")||`<div class="card empty">Sin compras en el rango</div>`}`;}
function rCP(K){const m={};K.forEach(c=>{if(!m[c.proveedor])m[c.proveedor]={n:0,t:0,compras:[]};if(!c.esDevolucion)m[c.proveedor].n++;m[c.proveedor].t+=c.total;m[c.proveedor].compras.push({fecha:c.fecha,total:c.total});});const lista=Object.entries(m).sort((a,b)=>b[1].t-a[1].t);const gt=K.reduce((a,c)=>a+c.total,0);const rows=lista.map(([p,d])=>{const pc=gt>0?((d.t/gt)*100).toFixed(1):0;return`<tr><td><b>${h(p)}</b></td><td>${d.n}</td><td style="color:${C.acc};font-weight:700">${fmt(d.t)}</td><td><div style="display:flex;align-items:center;gap:6px"><div style="background:#334155;border-radius:4px;height:6px;width:80px"><div style="width:${pc}%;background:${C.acc};height:6px;border-radius:4px"></div></div><span style="font-size:11px">${pc}%</span></div></td><td>${d.compras.map(c=>`<div style="font-size:11px;color:${C.muted}">${c.fecha} · ${fmt(c.total)}</div>`).join("")}</td></tr>`;}).join("");return`<div class="h2">🏭 Compras por Proveedor</div><div class="card"><div class="ov"><table><thead><tr><th>Proveedor</th><th>Órd.</th><th>Total</th><th>%</th><th>Fechas</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">Sin datos</td></tr>`}${lista.length?`<tr style="background:${C.bg}"><td style="font-weight:700">TOTAL</td><td>${K.length}</td><td style="color:${C.acc};font-weight:700">${fmt(gt)}</td><td>100%</td><td></td></tr>`:""}</tbody></table></div></div>`;}
function rER(V,K){const ing=V.reduce((a,v)=>a+v.total,0);const co=K.reduce((a,c)=>a+c.total,0);const ut=ing-co;const mg=ing>0?((ut/ing)*100).toFixed(1):0;return`<div class="h2">📈 Estado de Resultados</div><div class="card"><table><tbody>${[["Ingresos",fmt(ing),C.green,true],["Costo de Ventas",fmt(-co),C.red,false],["Utilidad Bruta",fmt(ut),ut>=0?C.green:C.red,true],["Margen Bruto",`${mg}%`,C.yel,true]].map(([l,v,c,b])=>`<tr><td style="padding:7px 10px;font-weight:${b?700:400};border-bottom:1px solid ${C.brd}">${l}</td><td style="padding:7px 10px;text-align:right;color:${c};font-weight:${b?700:400};border-bottom:1px solid ${C.brd}">${v}</td></tr>`).join("")}</tbody></table></div>`;}
function rFC(V,K){const mE={},mS={};V.forEach(v=>{mE[v.fecha]=(mE[v.fecha]||0)+v.total;});K.forEach(c=>{mS[c.fecha]=(mS[c.fecha]||0)+c.total;});const fs=[...new Set([...Object.keys(mE),...Object.keys(mS)])].sort();let sl=0;const filas=fs.map(f=>{const e=mE[f]||0,s=mS[f]||0;sl+=e-s;return{f,e,s,sl};});const tE=Object.values(mE).reduce((a,b)=>a+b,0),tS=Object.values(mS).reduce((a,b)=>a+b,0);return`<div class="h2">💵 Flujo de Caja</div><div class="grid2" style="margin-bottom:14px">${sc("Entradas",fmt(tE),C.green)}${sc("Salidas",fmt(tS),C.red)}${sc("Saldo Neto",fmt(tE-tS),tE-tS>=0?C.green:C.red)}</div><div class="card"><div class="ov"><table><thead><tr><th>Fecha</th><th>Entradas</th><th>Salidas</th><th>Flujo</th><th>Saldo Acum.</th></tr></thead><tbody>${filas.map(r=>`<tr><td>${r.f}</td><td style="color:${C.green}">${fmt(r.e)}</td><td style="color:${C.red}">${fmt(r.s)}</td><td style="color:${r.e-r.s>=0?C.green:C.red};font-weight:600">${fmt(r.e-r.s)}</td><td style="font-weight:700;color:${r.sl>=0?C.green:C.red}">${fmt(r.sl)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Sin movimientos</td></tr>`}</tbody></table></div></div>`;}
function rCA(){const hoy=new Date();const pend=DB.ventas.filter(v=>v.estado==="pendiente"&&v.vence);const rng=[{l:"Al día",a:-Infinity,b:0,c:C.green},{l:"0-30 días",a:0,b:30,c:C.yel},{l:"31-60 días",a:30,b:60,c:C.acc},{l:"+60 días",a:60,b:Infinity,c:C.red}];const gs=rng.map(r=>{const it=pend.filter(v=>{const d=(hoy-new Date(v.vence))/86400000;return d>r.a&&d<=r.b;});return{...r,it,t:it.reduce((a,v)=>a+v.saldo,0)};});const cards=gs.map(g=>`<div class="stat-card" style="border-left-color:${g.c}"><div class="stat-lbl">${g.l}</div><div class="stat-val" style="color:${g.c}">${fmt(g.t)}</div><div style="font-size:11px;color:${C.muted};margin-top:4px">${g.it.length} facturas</div></div>`).join("");const rows=pend.map(v=>{const d=Math.round((hoy-new Date(v.vence))/86400000);const gc=gs.find(g=>d>g.a&&d<=g.b);return`<tr><td style="color:${C.muted};font-size:11px">#${v.id.slice(-6).toUpperCase()}</td><td>${h(v.cliente)}</td><td>${v.vence}</td><td style="color:${gc?.c||C.muted};font-weight:600">${d>0?`${d}d vencida`:`${-d}d restantes`}</td><td style="color:${C.yel};font-weight:700">${fmt(v.saldo)}</td></tr>`;}).join("");return`<div class="h2">📅 Análisis de Cartera</div><div class="grid2" style="margin-bottom:14px">${cards}</div><div class="card"><div class="ov"><table><thead><tr><th>#</th><th>Cliente</th><th>Vence</th><th>Antigüedad</th><th>Saldo</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">Sin cartera vencida</td></tr>`}</tbody></table></div></div>`;}
function rRO(V){const m={};V.forEach(v=>(v.lineas||[]).forEach(l=>{if(!m[l.desc])m[l.desc]={q:0,dias:new Set()};m[l.desc].q+=l.qty;if(l.qty>0)m[l.desc].dias.add(v.fecha);}));const rows=Object.entries(m).sort((a,b)=>b[1].q-a[1].q).map(([p,d])=>{const prod=DB.productos.find(pr=>pr.nombre===p);return`<tr><td><b>${h(p)}</b></td><td>${d.q}</td><td>${d.dias.size}</td><td style="color:${C.green};font-weight:600">${prod?prod.stock:"-"}</td><td style="color:${prod&&prod.stock>0?(d.q/prod.stock>1?C.green:C.yel):C.muted}">${prod&&prod.stock>0?(d.q/prod.stock).toFixed(2)+"x":"-"}</td></tr>`;}).join("");return`<div class="h2">🔄 Rotación de Inventario</div><div class="card"><div class="ov"><table><thead><tr><th>Producto</th><th>Uds. Vend.</th><th>Días Activo</th><th>Stock Actual</th><th>Rotación</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">Sin datos</td></tr>`}</tbody></table></div></div>`;}
function rFP(V){const m={};V.forEach(v=>{if(!m[v.fp])m[v.fp]={n:0,t:0};m[v.fp].n++;m[v.fp].t+=v.total;});const gt=V.reduce((a,v)=>a+v.total,0);const rows=Object.entries(m).sort((a,b)=>b[1].t-a[1].t).map(([fp,d])=>{const p=gt>0?((d.t/gt)*100).toFixed(1):0;return`<tr><td><b>${fp}</b></td><td>${d.n}</td><td style="color:${C.green};font-weight:700">${fmt(d.t)}</td><td>${p}%</td></tr>`;}).join("");return`<div class="h2">💳 Ventas por Forma de Pago</div><div class="card"><div class="ov"><table><thead><tr><th>Forma</th><th>Transacciones</th><th>Total</th><th>%</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="empty">Sin datos</td></tr>`}</tbody></table></div></div>`;}
function rRC(V){const cliSel=RCS;const clis=[...new Set(V.map(v=>v.cliente))].sort();const sel=`<div style="margin-bottom:14px"><label class="lbl">Seleccionar Cliente</label><select onchange="RCS=this.value;R()" style="max-width:300px"><option value="">-- Todos --</option>${clis.map(c=>`<option value="${c}"${c===cliSel?" selected":""}>${h(c)}</option>`).join("")}</select></div>`;const vf=cliSel?V.filter(v=>v.cliente===cliSel):V;const total=vf.reduce((a,v)=>a+v.total,0);const rows=vf.map(v=>`<tr><td style="color:${C.muted};font-size:11px">#${v.id.slice(-6).toUpperCase()}</td><td>${v.fecha}</td><td>${v.fp}</td><td style="color:${C.green};font-weight:600">${fmt(v.total)}</td><td>${bdg(v.estado,estColor(v.estado))}</td></tr>`).join("");return`<div class="h2">👤 Reporte por Cliente</div>${sel}<div class="card"><div class="ov"><table><thead><tr><th>#</th><th>Fecha</th><th>Forma</th><th>Total</th><th>Estado</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">Sin transacciones</td></tr>`}</tbody></table></div>${vf.length?`<div style="text-align:right;padding:10px;border-top:1px solid ${C.brd}"><b>Total: <span style="color:${C.green}">${fmt(total)}</span></b></div>`:""}</div>`;}

let SCAT=[];
function toggleScat(cat){
  if(SCAT.includes(cat)){SCAT=SCAT.filter(c=>c!==cat);}
  else{SCAT.push(cat);}
  const el=document.getElementById("cat-tbody");
  const el2=document.getElementById("cat-summary");
  if(el) renderCatTable();
}
function renderCatTable(){
  const prods=DB.productos;
  const allCats=[...new Set(prods.map(p=>p.categoria||"Sin categoría"))].sort();
  const activeCats=SCAT.length?SCAT:allCats;
  const filtered=prods.filter(p=>activeCats.includes(p.categoria||"Sin categoría"));
  const totU=filtered.reduce((a,p)=>a+p.stock,0);
  const totC=filtered.reduce((a,p)=>a+(p.stock*p.costo),0);
  const totUt=filtered.reduce((a,p)=>a+(p.stock*(p.precio-p.costo)),0);
  const totMg=totC>0?((totUt/totC)*100).toFixed(1):0;

  const cats={};
  filtered.forEach(p=>{
    const c=p.categoria||"Sin categoría";
    if(!cats[c])cats[c]={u:0,costo:0,ut:0,items:0};
    cats[c].u+=p.stock;
    cats[c].costo+=p.stock*p.costo;
    cats[c].ut+=p.stock*(p.precio-p.costo);
    cats[c].items++;
  });
  const catList=Object.entries(cats).sort((a,b)=>b[1].costo-a[1].costo);
  const totCatCosto=catList.reduce((a,[,d])=>a+d.costo,0);

  const catRows=catList.map(([cat,d])=>{
    const mg=d.costo>0?((d.ut/d.costo)*100).toFixed(1):0;
    const pct=totCatCosto>0?((d.costo/totCatCosto)*100).toFixed(1):0;
    return`<tr>
      <td><b>${h(cat)}</b></td>
      <td style="text-align:center">${d.items}</td>
      <td style="text-align:right">${d.u}</td>
      <td style="text-align:right;color:${C.blue}">${fmt(d.costo)}</td>
      <td style="text-align:right;color:${d.ut>=0?C.green:C.red};font-weight:600">${fmt(d.ut)}</td>
      <td style="text-align:right;color:${C.muted}">${mg}%</td>
      <td style="text-align:right">
        <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
          <div style="background:#334155;border-radius:4px;height:6px;width:60px">
            <div style="width:${pct}%;background:${C.acc};height:6px;border-radius:4px"></div>
          </div>
          <span style="font-size:11px;color:${C.muted}">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join("");

  const sumRow=catList.length?`<tr style="background:${C.bg};border-top:2px solid ${C.brd}">
    <td style="font-weight:700">TOTAL</td>
    <td style="text-align:center;font-weight:700">${filtered.length}</td>
    <td style="text-align:right;font-weight:700">${totU}</td>
    <td style="text-align:right;color:${C.blue};font-weight:700">${fmt(totC)}</td>
    <td style="text-align:right;color:${totUt>=0?C.green:C.red};font-weight:700">${fmt(totUt)}</td>
    <td style="text-align:right;color:${C.muted};font-weight:700">${totMg}%</td>
    <td></td>
  </tr>`:"";

  const el=document.getElementById("cat-tbody");
  if(el) el.innerHTML=(catRows||`<tr><td colspan="7" class="empty">Sin categorías</td></tr>`)+sumRow;
}
function rINV(){
  const prods=DB.productos.filter(p=>p.stock>0);
  const totU=prods.reduce((a,p)=>a+p.stock,0);
  const totC=prods.reduce((a,p)=>a+(p.stock*p.costo),0);
  const totUt=prods.reduce((a,p)=>a+(p.stock*(p.precio-p.costo)),0);
  const totMg=totC>0?((totUt/totC)*100).toFixed(1):0;

  const allCats=[...new Set(prods.map(p=>p.categoria||"Sin categoría"))].sort();

const r2=n=>Math.round((+n||0)*100)/100;
const sumDev=t=>DB.devoluciones.filter(d=>d.tipo===t).reduce((a,d)=>a+d.total,0);

function devPrevia(docId,k){return DB.devoluciones.filter(d=>d.docId===docId).reduce((a,d)=>a+d.lineas.filter(l=>l.ki===k).reduce((s,l)=>s+l.qty,0),0);}
function devDeDoc(docId){return DB.devoluciones.filter(d=>d.docId===docId);}
function credDisp(ct,ter){return r2(DB.creditos.filter(c=>c.tipo===ct&&c.tercero===ter&&c.estado==="vigente").reduce((a,c)=>a+c.saldo,0));}
function credBadge(tipo,e){const m=credDisp(tipo==="clientes"?"cliente":"proveedor",e.nombre);return m>0?` ${bdg("Saldo a favor "+fmt(m),C.blue)}`:"";}
function prodDeLinea(l){return(l.pid!==""&&l.pid!==undefined&&l.pid!==null)?(DB.productos[+l.pid]||null):null;}
function devPseudo(tipo){
const esV=tipo==="venta";
return DB.devoluciones.filter(d=>d.tipo===tipo).map(d=>{
const base={id:d.id,fecha:d.fecha,fp:"devolución",total:-d.total,saldo:0,estado:"devolución",usuario:d.usuario,pagos:[],esDevolucion:true,
lineas:d.lineas.map(l=>esV?{desc:l.desc,qty:-l.qty,pu:l.pu}:{desc:l.desc,qty:-l.qty,costo:l.costo})};
return esV?{...base,cliente:d.tercero}:{...base,proveedor:d.tercero};
});
}
function devNueva(tipo,i){
const doc=tipo==="venta"?DB.ventas[i]:DB.compras[i];
if(!doc)return;
if(doc.estado==="anulado")return alert("No se puede devolver: el documento está anulado.");
if(doc.esSaldoInicial)return alert("No se puede devolver un saldo inicial.");
if(doc.estado==="devuelta")return alert("Este documento ya fue devuelto por completo.");
DV={tipo,idx:i,fecha:tod(),motivo:"",dest:"reembolso",forma:"efectivo",lns:(doc.lineas||[]).map((l,k)=>({k,qty:0}))};
R();
}
function devSetQty(k,v){DV.lns[k].qty=Math.max(0,+v||0);R();}
function devCalc(){
const f=DV;const esV=f.tipo==="venta";
const doc=esV?DB.ventas[f.idx]:DB.compras[f.idx];
const filas=(doc.lineas||[]).map((l,k)=>{
const prev=devPrevia(doc.id,k);
const disp=Math.max(0,l.qty-prev);
const q=Math.min(Math.max(0,+f.lns[k].qty||0),disp);
const pu=esV?l.pu:l.costo;
const p=prodDeLinea(l);
return{k,l,prev,disp,q,pu,valor:r2(q*pu),stock:p?p.stock:null};
});
const total=r2(filas.reduce((a,x)=>a+x.valor,0));
const aplicado=r2(Math.min(total,doc.saldo||0));
const resto=r2(total-aplicado);
return{doc,filas,total,aplicado,resto,esV};
}

</div>${destino}</div>
${bx("↩ Registrar devolución",C.yel,"devGuardar()")}`;

async function devGuardar(){
if(!DV)return;
const c=devCalc();const f=DV;const doc=c.doc;const esV=c.esV;
const sel=c.filas.filter(x=>x.q>0);
if(!sel.length)return alert("Indique la cantidad a devolver de al menos un producto.");
if(!f.fecha)return alert("Indique la fecha.");
const delta={};
for(const x of sel){if(prodDeLinea(x.l)){const k=+x.l.pid;delta[k]=(delta[k]||0)+(esV?x.q:-x.q);}}
if(!esV){for(const k in delta){const p=DB.productos[+k];if(p.stock+delta[k]<0)return alert(`No hay stock suficiente de "${p.nombre}" para devolverlo al proveedor (stock actual: ${p.stock}). Si ya se vendió, no se puede devolver.`);}}
const lineas=sel.map(x=>{
const o=x.l;const p=prodDeLinea(o);
const base={ki:x.k,pid:o.pid,desc:o.desc,qty:x.q};
if(esV){const cu=(o.costo!==undefined&&o.costo!==null)?o.costo:(p?(p.costo||0):0);return{...base,pu:o.pu,costo:cu,costoEstimado:(o.costo===undefined||o.costo===null)};}
return{...base,costo:o.costo};
});
const dest=c.resto>0?f.dest:"";
const dev={id:uid(),tipo:f.tipo,fecha:f.fecha,docId:doc.id,tercero:esV?doc.cliente:doc.proveedor,lineas,total:c.total,aplicado:c.aplicado,reembolso:dest==="reembolso"?c.resto:0,credito:dest==="credito"?c.resto:0,forma:dest==="reembolso"?f.forma:"",motivo:(f.motivo||"").trim(),usuario:CU?.email||""};
const completa=(doc.lineas||[]).every((l,k)=>l.qty-devPrevia(doc.id,k)-c.filas[k].q<=0);
const saldoNuevo=r2((doc.saldo||0)-c.aplicado);
let estado=doc.estado;
if(completa)estado="devuelta";else if(doc.estado==="pendiente"&&saldoNuevo===0)estado="pagado";
const upd={...doc,devuelto:r2((doc.devuelto||0)+c.total),saldo:saldoNuevo,estado};

async function aplicarCredito(tipo){

if(!item)return;

const usar=r2(Math.min(credDisp(ct,ter),item.saldo||0));

const creds=DB.creditos.filter(c=>c.tipo===ct&&c.tercero===ter&&c.estado==="vigente"&&c.saldo>0).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
const ops=[];const nuevos=[];
for(const c of creds){
if(falta<=0)break;
const t=r2(Math.min(c.saldo,falta));
const u={...c,saldo:r2(c.saldo-t)};
if(u.saldo<=0)u.estado="agotado";
ops.push(["creditos",c.id,u]);nuevos.push(u);falta=r2(falta-t);
}
const pago={fecha:tod(),monto:usar,forma:"saldo a favor",usuario:CU?.email||""};
const saldo=r2((item.saldo||0)-usar);
const updated={...item,saldo,estado:saldo===0?"pagado":"pendiente",pagos:[...(item.pagos||[]),pago]};
ops.push([cob?"ventas":"compras",item.id,updated]);
try{
await fsBatch(ops);
nuevos.forEach(u=>{const j=DB.creditos.findIndex(c=>c.id===u.id);if(j>=0)DB.creditos[j]=u;});
(cob?DB.ventas:DB.compras)[idx]=updated;
await logAct("SALDO A FAVOR APLICADO",`${ter} · ${fmt(usar)}`);
if(saldo===0){if(cob)ST.cxcIdx=-1;else ST.cxpIdx=-1;}
PM.monto=saldo;R();
}catch(e){alert("Error: "+e.message);}
}

const mk=(lista,key)=>{const m={};
lista.filter(d=>d.estado==="pendiente").forEach(d=>{const n=d[key]||"(vacío)";const o=m[n]=m[n]||{docs:0,si:0,otros:0};o.docs++;if(d.esSaldoInicial)o.si+=+d.saldo||0;else o.otros+=+d.saldo||0;});
return Object.entries(m).map(([n,o])=>({n,docs:o.docs,si:r2(o.si),otros:r2(o.otros),tot:r2(o.si+o.otros)})).sort((a,b)=>b.tot-a.tot);};
return{cxc:mk(DB.ventas,"cliente"),cxp:mk(DB.compras,"proveedor")};
}
function rDIAG(){
const cks=diagnostico();const res=diagResumen();
const nv={error:["Error",C.red],aviso:["Aviso",C.yel],info:["Info",C.blue]};
const con=cks.filter(c=>c.filas.length);const sin=cks.filter(c=>!c.filas.length);
const cnt=n=>con.filter(c=>c.nivel===n).length;
const grupos=["Facturas","Saldos iniciales","Inventario","Clientes y proveedores","Devoluciones y saldo a favor"];
const CAP=200;
const bloque=con.length?grupos.map(g=>{
const L=con.filter(c=>c.grupo===g);
if(!L.length)return"";
return`<div class="h2" style="margin-top:6px">${g}</div>`+L.map(c=>`<div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px"><b>${h(c.titulo)}</b>${bdg(nv[c.nivel][0],nv[c.nivel][1])}${bdg(c.filas.length+(c.filas.length===1?" hallazgo":" hallazgos"),C.muted)}</div>
${c.ayuda?`<div style="font-size:12px;color:${C.muted};margin-bottom:8px">${h(c.ayuda)}</div>`:""}
<div class="ov"><table><thead><tr>${c.cols.map(x=>`<th>${h(x)}</th>`).join("")}</tr></thead><tbody>${c.filas.slice(0,CAP).map(r=>`<tr>${r.map(v=>`<td>${h(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
${c.filas.length>CAP?`<div style="font-size:12px;color:${C.muted};margin-top:6px">Se muestran los primeros ${CAP} de ${c.filas.length}.</div>`:""}</div>`).join("");
}).join(""):`<div class="card empty">✅ No se encontró ningún hallazgo</div>`;
const tabla=(t,L,col)=>`<div class="card"><div class="h2" style="margin-bottom:6px">${t}</div><div class="ov"><table><thead><tr><th>${col}</th><th>Facturas pendientes</th><th>Saldo inicial</th><th>Otras facturas</th><th>Total pendiente</th></tr></thead><tbody>${L.map(o=>`<tr><td>${h(o.n)}</td><td>${o.docs}</td><td>${fmt(o.si)}</td><td>${fmt(o.otros)}</td><td style="font-weight:600">${fmt(o.tot)}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Sin saldos pendientes</td></tr>`}${L.length?`<tr><td><b>TOTAL</b></td><td>${L.reduce((a,o)=>a+o.docs,0)}</td><td>${fmt(r2(L.reduce((a,o)=>a+o.si,0)))}</td><td>${fmt(r2(L.reduce((a,o)=>a+o.otros,0)))}</td><td style="font-weight:700">${fmt(r2(L.reduce((a,o)=>a+o.tot,0)))}</td></tr>`:""}</tbody></table></div></div>`;
return`<div class="h2">🩺 Diagnóstico de datos</div>
<div class="grid2" style="margin-bottom:14px">${sc("Errores",cnt("error"),cnt("error")?C.red:C.green)}${sc("Avisos",cnt("aviso"),cnt("aviso")?C.yel:C.green)}${sc("Información",cnt("info"),C.blue)}${sc("Revisiones sin hallazgos",sin.length,C.green)}</div>
${bloque}
<div class="h2" style="margin-top:6px">Resumen de saldos pendientes</div>
<div style="font-size:12px;color:${C.muted};margin-bottom:8px">Para comparar con tus registros. "Saldo inicial" son los documentos marcados como saldo inicial; "Otras facturas" incluye lo que se cargó como venta o compra normal.</div>
${tabla("Por cobrar, por cliente",res.cxc,"Cliente")}${tabla("Por pagar, por proveedor",res.cxp,"Proveedor")}
${sin.length?`<div class="card"><div class="h2" style="margin-bottom:6px">Revisiones sin hallazgos</div>${sin.map(c=>`<div style="font-size:13px;margin-bottom:3px">✓ ${h(c.titulo)}</div>`).join("")}</div>`:""}`;
}

/* ═══ COBROS Y PAGOS (dinero efectivo) ═══ */
const cbSum=L=>r2(L.reduce((a,x)=>a+x.monto,0));
function movCaja(desde,hasta){
const en=f=>!!f&&f>=desde&&f<=hasta;
const id6=id=>"#"+String(id||"").slice(-6).toUpperCase();
const cob=[],pag=[];
DB.ventas.forEach(d=>{
if(d.fp==="contado"&&d.estado!=="anulado"&&en(d.fecha))cob.push({fecha:d.fecha,conc:"contado",tipo:"Venta de contado",tercero:d.cliente,doc:id6(d.id),forma:"contado",monto:+d.total||0,usuario:d.usuario||""});
(d.pagos||[]).forEach(p=>{if(p.forma==="saldo a favor"||!en(p.fecha))return;cob.push({fecha:p.fecha,conc:d.esSaldoInicial?"saldo":"cartera",tipo:d.esSaldoInicial?"Cobro de saldo inicial":"Cobro CxC",tercero:d.cliente,doc:id6(d.id),forma:p.forma||"-",monto:+p.monto||0,usuario:p.usuario||""});});
});
DB.devoluciones.filter(v=>v.tipo==="venta"&&(+v.reembolso||0)>0&&en(v.fecha)).forEach(v=>cob.push({fecha:v.fecha,conc:"devolucion",tipo:"Reembolso por devolución",tercero:v.tercero,doc:id6(v.docId),forma:v.forma||"-",monto:-(+v.reembolso),usuario:v.usuario||""}));
DB.compras.forEach(d=>{
if(d.fp==="contado"&&d.estado!=="anulado"&&en(d.fecha))pag.push({fecha:d.fecha,conc:"contado",tipo:"Compra de contado",tercero:d.proveedor,doc:id6(d.id),forma:"contado",monto:+d.total||0,usuario:d.usuario||""});
(d.pagos||[]).forEach(p=>{if(p.forma==="saldo a favor"||!en(p.fecha))return;pag.push({fecha:p.fecha,conc:d.esSaldoInicial?"saldo":"cartera",tipo:d.esSaldoInicial?"Pago de saldo inicial":"Pago CxP",tercero:d.proveedor,doc:id6(d.id),forma:p.forma||"-",monto:+p.monto||0,usuario:p.usuario||""});});
});
DB.devoluciones.filter(v=>v.tipo==="compra"&&(+v.reembolso||0)>0&&en(v.fecha)).forEach(v=>pag.push({fecha:v.fecha,conc:"devolucion",tipo:"Dinero recuperado del proveedor",tercero:v.tercero,doc:id6(v.docId),forma:v.forma||"-",monto:-(+v.reembolso),usuario:v.usuario||""}));
const ord=(a,b)=>String(a.fecha).localeCompare(String(b.fecha))||a.doc.localeCompare(b.doc);
cob.sort(ord);pag.sort(ord);
return{cob,pag};
}
function rCOB(){
const {cob,pag}=movCaja(ST.rD,ST.rH);
const tc=cbSum(cob),tp=cbSum(pag),neto=r2(tc-tp);
const conceptos=[["contado","Ventas y compras de contado"],["cartera","Cobros y pagos de CxC y CxP"],["saldo","Saldos iniciales cobrados y pagados"],["devolucion","Reembolsos y recuperos por devolución"]];
const por=(L,k,v)=>cbSum(L.filter(x=>x[k]===v));
const filasConc=conceptos.map(([k,l])=>`<tr><td>${l}</td><td style="text-align:right">${fmt(por(cob,"conc",k))}</td><td style="text-align:right">${fmt(por(pag,"conc",k))}</td></tr>`).join("");
const orden=["contado","efectivo","transferencia","tarjeta","cheque","otro"];
const formas=[...new Set([...cob,...pag].map(x=>x.forma))].sort((a,b)=>{const ia=orden.indexOf(a),ib=orden.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||String(a).localeCompare(String(b));});
const filasForma=formas.map(f=>{const c=por(cob,"forma",f),p=por(pag,"forma",f);return`<tr><td style="text-transform:capitalize">${f==="contado"?"Contado (al registrar el documento)":h(f)}</td><td style="text-align:right">${fmt(c)}</td><td style="text-align:right">${fmt(p)}</td><td style="text-align:right;color:${r2(c-p)>=0?C.green:C.red};font-weight:600">${fmt(r2(c-p))}</td></tr>`;}).join("");
const dias=[...new Set([...cob,...pag].map(x=>x.fecha))].sort();
let acum=0;
const filasDia=dias.map(f=>{const c=por(cob,"fecha",f),p=por(pag,"fecha",f);acum=r2(acum+c-p);return`<tr><td>${f}</td><td style="text-align:right">${fmt(c)}</td><td style="text-align:right">${fmt(p)}</td><td style="text-align:right;color:${r2(c-p)>=0?C.green:C.red};font-weight:600">${fmt(r2(c-p))}</td><td style="text-align:right;font-weight:700;color:${acum>=0?C.green:C.red}">${fmt(acum)}</td></tr>`;}).join("");
const det=(t,L,col,total)=>`<div class="card"><div class="h2" style="margin-bottom:6px">${t}</div><div class="ov"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>${col}</th><th>Doc.</th><th>Forma</th><th style="text-align:right">Monto</th><th>Usuario</th></tr></thead><tbody>${L.map(x=>`<tr><td>${h(x.fecha)}</td><td>${h(x.tipo)}</td><td>${h(x.tercero||"-")}</td><td style="font-size:11px;color:${C.muted}">${h(x.doc)}</td><td>${h(x.forma)}</td><td style="text-align:right;font-weight:600;color:${x.monto<0?C.red:C.green}">${fmt(x.monto)}</td><td style="font-size:11px;color:${C.muted}">${h(x.usuario||"-")}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">Sin movimientos en el rango</td></tr>`}${L.length?`<tr><td colspan="5"><b>TOTAL</b></td><td style="text-align:right;font-weight:700">${fmt(total)}</td><td></td></tr>`:""}</tbody></table></div></div>`;
return`<div class="h2">💰 Cobros y Pagos</div>
<div style="font-size:12px;color:${C.muted};margin-bottom:10px">Dinero que realmente entró y salió entre ${h(ST.rD)} y ${h(ST.rH)}. Las ventas y compras de contado se cuentan el día del documento; las de crédito, transferencia o tarjeta, el día en que se registró el cobro o el pago. Los abonos con saldo a favor no son dinero y no se incluyen. Los reembolsos por devolución restan.</div>
<div class="grid2" style="margin-bottom:14px">${sc("Cobrado",fmt(tc),C.green)}${sc("Pagado",fmt(tp),C.red)}${sc("Diferencia (cobrado - pagado)",fmt(neto),neto>=0?C.green:C.red)}${sc("Movimientos",cob.length+pag.length,C.acc)}</div>
<div class="card"><div class="h2" style="margin-bottom:6px">Por concepto</div><div class="ov"><table><thead><tr><th>Concepto</th><th style="text-align:right">Cobrado</th><th style="text-align:right">Pagado</th></tr></thead><tbody>${filasConc}<tr><td><b>TOTAL</b></td><td style="text-align:right;font-weight:700">${fmt(tc)}</td><td style="text-align:right;font-weight:700">${fmt(tp)}</td></tr></tbody></table></div></div>
<div class="card"><div class="h2" style="margin-bottom:6px">Por forma de pago</div><div class="ov"><table><thead><tr><th>Forma</th><th style="text-align:right">Cobrado</th><th style="text-align:right">Pagado</th><th style="text-align:right">Diferencia</th></tr></thead><tbody>${filasForma||`<tr><td colspan="4" class="empty">Sin movimientos en el rango</td></tr>`}</tbody></table></div></div>
<div class="card"><div class="h2" style="margin-bottom:6px">Resumen por día</div><div class="ov"><table><thead><tr><th>Fecha</th><th style="text-align:right">Cobrado</th><th style="text-align:right">Pagado</th><th style="text-align:right">Diferencia</th><th style="text-align:right">Acumulado</th></tr></thead><tbody>${filasDia||`<tr><td colspan="5" class="empty">Sin movimientos en el rango</td></tr>`}</tbody></table></div></div>
${det("Detalle de cobros",cob,"Cliente",tc)}${det("Detalle de pagos",pag,"Proveedor",tp)}`;
}

/* ═══ COBROS REALIZADOS / PAGOS REALIZADOS ═══ */
const MOVF={cobros:"todos",pagos:"todos"};
function movSinFecha(){
const ok=f=>/^\d{4}-\d{2}-\d{2}$/.test(String(f||""))&&!isNaN(new Date(f));
const id6=id=>"#"+String(id||"").slice(-6).toUpperCase();
const c=[],p=[];
const rec=(lista,out,ter,tc,tp,ts)=>lista.forEach(d=>{
if(d.fp==="contado"&&d.estado!=="anulado"&&!ok(d.fecha))out.push({tipo:tc,tercero:d[ter],doc:id6(d.id),fecha:d.fecha||"(vacía)",forma:"contado",monto:+d.total||0});
(d.pagos||[]).forEach(x=>{if(x.forma!=="saldo a favor"&&!ok(x.fecha))out.push({tipo:d.esSaldoInicial?ts:tp,tercero:d[ter],doc:id6(d.id),fecha:x.fecha||"(vacía)",forma:x.forma||"-",monto:+x.monto||0});});
});
rec(DB.ventas,c,"cliente","Venta de contado","Cobro CxC","Cobro de saldo inicial");
rec(DB.compras,p,"proveedor","Compra de contado","Pago CxP","Pago de saldo inicial");
DB.devoluciones.filter(v=>(+v.reembolso||0)>0&&!ok(v.fecha)).forEach(v=>(v.tipo==="venta"?c:p).push({tipo:v.tipo==="venta"?"Reembolso por devolución":"Dinero recuperado del proveedor",tercero:v.tercero,doc:id6(v.docId),fecha:v.fecha||"(vacía)",forma:v.forma||"-",monto:-(+v.reembolso)}));
return{c,p};
}
function rMOV(k){
const esC=k==="cobros";
const mv=movCaja(ST.rD,ST.rH);
const todos=esC?mv.cob:mv.pag;
const f=MOVF[k];
const L=(f==="todos"?todos:todos.filter(x=>x.conc===f)).slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||b.doc.localeCompare(a.doc));
const tot=cbSum(L);
const opts=esC
?[["todos","Todos los cobros"],["cartera","Cobros de CxC"],["saldo","Cobros de saldos iniciales"],["contado","Ventas de contado"],["devolucion","Reembolsos por devolución"]]
:[["todos","Todos los pagos"],["cartera","Pagos de CxP"],["saldo","Pagos de saldos iniciales"],["contado","Compras de contado"],["devolucion","Dinero recuperado de proveedores"]];
const etq=(opts.find(o=>o[0]===f)||opts[0])[1];
const grp=(key)=>{const m={};L.forEach(x=>{const n=key(x)||"-";const o=m[n]=m[n]||{n:0,t:0};o.n++;o.t+=x.monto;});return Object.entries(m).map(([n,o])=>({n,c:o.n,t:r2(o.t)})).sort((a,b)=>b.t-a.t);};
const porT=grp(x=>x.tercero);const porF=grp(x=>x.forma);
const sf=movSinFecha()[esC?"c":"p"];
const hint=ST.rH<tod()?`<div style="background:#f59e0b22;border:1px solid ${C.yel};border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px">El rango termina el ${h(ST.rH)} y hoy es ${h(tod())}. Para incluir los últimos días usa «Este mes» o cambia "Hasta".</div>`:"";
const tbl=(t,cols,rows,total)=>`<div class="card"><div class="h2" style="margin-bottom:6px">${t}</div><div class="ov"><table><thead><tr>${cols.map((c,i)=>`<th${c[1]?` style="text-align:right"`:""}>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}" class="empty">Sin movimientos en el rango</td></tr>`}${total||""}</tbody></table></div></div>`;
const filasT=porT.map(o=>`<tr><td>${h(o.n)}</td><td style="text-align:right">${o.c}</td><td style="text-align:right;font-weight:600">${fmt(o.t)}</td></tr>`).join("");
const filasF=porF.map(o=>`<tr><td style="text-transform:capitalize">${o.n==="contado"?"Contado (al registrar el documento)":h(o.n)}</td><td style="text-align:right">${o.c}</td><td style="text-align:right;font-weight:600">${fmt(o.t)}</td></tr>`).join("");
const filasD=L.map(x=>`<tr><td>${h(x.fecha)}</td><td>${h(x.tipo)}</td><td>${h(x.tercero||"-")}</td><td style="font-size:11px;color:${C.muted}">${h(x.doc)}</td><td>${h(x.forma)}</td><td style="text-align:right;font-weight:600;color:${x.monto<0?C.red:C.green}">${fmt(x.monto)}</td><td style="font-size:11px;color:${C.muted}">${h(x.usuario||"-")}</td></tr>`).join("");
const bloqueSF=sf.length?`<div class="card" style="border-color:${C.yel}"><div class="h2" style="margin-bottom:4px;color:${C.yel}">Movimientos que no entran en ningún rango por tener fecha inválida (${sf.length})</div><div style="font-size:12px;color:${C.muted};margin-bottom:8px">Su fecha está vacía o no tiene formato AAAA-MM-DD, por eso no aparecen en los reportes por fechas. Se corrige en Firebase, en el campo fecha del cobro o pago.</div><div class="ov"><table><thead><tr><th>Concepto</th><th>${esC?"Cliente":"Proveedor"}</th><th>Doc.</th><th>Fecha guardada</th><th>Forma</th><th style="text-align:right">Monto</th></tr></thead><tbody>${sf.map(x=>`<tr><td>${h(x.tipo)}</td><td>${h(x.tercero||"-")}</td><td>${h(x.doc)}</td><td>${h(x.fecha)}</td><td>${h(x.forma)}</td><td style="text-align:right">${fmt(x.monto)}</td></tr>`).join("")}</tbody></table></div></div>`:"";
return`<div class="h2">${esC?"📥 Cobros realizados":"📤 Pagos realizados"}</div>
<div style="font-size:12px;color:${C.muted};margin-bottom:8px">Del ${h(ST.rD)} al ${h(ST.rH)}. Cuenta el dinero el día en que se registró el ${esC?"cobro":"pago"}; las ${esC?"ventas":"compras"} de contado, el día del documento. Los abonos con saldo a favor no son dinero y no se incluyen.</div>
${hint}
<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px">
<div><label class="lbl">Concepto</label><select onchange="MOVF.${k}=this.value;R()" style="width:260px">${opts.map(o=>`<option value="${o[0]}"${f===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></div>
<span style="font-size:12px;color:${C.muted}">Mostrando: ${h(etq)}</span></div>
<div class="grid2" style="margin-bottom:14px">${sc(esC?"Total cobrado":"Total pagado",fmt(tot),esC?C.green:C.red)}${sc("Movimientos",L.length,C.acc)}${sc(esC?"De saldos iniciales":"De saldos iniciales",fmt(cbSum(todos.filter(x=>x.conc==="saldo"))),C.blue)}${sc(esC?"De CxC":"De CxP",fmt(cbSum(todos.filter(x=>x.conc==="cartera"))),C.yel)}</div>
${tbl(esC?"Por cliente":"Por proveedor",[[esC?"Cliente":"Proveedor"],["Movimientos",1],["Total",1]],filasT,L.length?`<tr><td><b>TOTAL</b></td><td style="text-align:right">${L.length}</td><td style="text-align:right;font-weight:700">${fmt(tot)}</td></tr>`:"")}
${tbl("Por forma de pago",[["Forma"],["Movimientos",1],["Total",1]],filasF)}
${tbl("Detalle (del más reciente al más antiguo)",[["Fecha"],["Concepto"],[esC?"Cliente":"Proveedor"],["Doc."],["Forma"],["Monto",1],["Usuario"]],filasD,L.length?`<tr><td colspan="5"><b>TOTAL</b></td><td style="text-align:right;font-weight:700">${fmt(tot)}</td><td></td></tr>`:"")}
${bloqueSF}`;
}
</script>
</body>
</html>
